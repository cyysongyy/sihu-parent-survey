<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>家長問卷即時統計</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#1F2A3A;--card:#2A3850;--ink:#FBFBF8;--sub:#BFD8D5;--emo:#5CC4BD;--beh:#E9B872;--soc:#7DB4E6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-size:22px}
header{display:flex;gap:32px;align-items:center;padding:24px 40px}
header h1{margin:0;font-size:40px;flex:1}
#qr{background:#fff;padding:8px;border-radius:8px;line-height:0}
.count{text-align:center}.count b{display:block;font-size:72px;line-height:1;color:var(--beh)}
main{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;padding:0 40px 24px}
.panel{background:var(--card);border-radius:16px;padding:20px 24px}
.panel h2{margin:0 0 14px;font-size:30px}
.row{display:grid;grid-template-columns:1fr 64px;gap:4px 12px;align-items:center;margin-bottom:12px}
.row .lab{grid-column:1/-1;font-size:20px}
.track{height:22px;background:rgba(255,255,255,.12);border-radius:11px;overflow:hidden}
.fill{height:100%;border-radius:11px;transition:width .6s}
.num{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.pri{padding:0 40px 40px}.pri .panel{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.pri .panel h2{margin:0}
.chip{flex:1;min-width:180px;text-align:center;border-radius:12px;padding:12px;background:rgba(255,255,255,.08)}
.chip b{display:block;font-size:44px}
.note{padding:0 40px 24px;color:var(--sub);font-size:18px}
@media (max-width:900px){main{grid-template-columns:1fr}header{flex-wrap:wrap}}
</style>
</head>
<body>
<header>
  <h1>家長問卷　即時統計</h1>
  <div class="count"><b id="total">0</b>份回覆</div>
  <div id="qr"></div>
</header>
<main>
  <div class="panel" id="p-emotion" style="--c:var(--emo)"><h2 style="color:var(--emo)">情緒</h2></div>
  <div class="panel" id="p-behavior" style="--c:var(--beh)"><h2 style="color:var(--beh)">行為</h2></div>
  <div class="panel" id="p-social" style="--c:var(--soc)"><h2 style="color:var(--soc)">人際</h2></div>
</main>
<div class="pri"><div class="panel"><h2>最想先改善</h2><div id="pri" style="display:flex;gap:16px;flex:1;flex-wrap:wrap"></div></div></div>
<div class="note" id="note"></div>

<script>
// 與 index.html 相同的 Apps Script 網址（結尾 /exec）。空白時顯示示範資料。
const API_URL = "";

const ORDER={
  emotion:["容易生氣、煩躁","焦慮、緊張","難過、低落","課業升學壓力大","不說出自己的感受","沒有明顯困擾"],
  behavior:["衝動、頂嘴","拖延、要一直催","過度使用手機網路","不遵守規範","遇到困難就逃避","沒有明顯困擾"],
  social:["與孩子溝通時，經常演變成責備、爭吵或冷戰","與同學容易發生爭執或意見衝突","覺得自己沒有知心朋友，或常感到被孤立","曾遭遇言語嘲諷、排擠、欺負或網路霸凌","不容易表達自己的想法，也不敢拒絕他人的要求","家長與教師對孩子的管教方式或期待不同","近期沒有明顯的人際互動困擾"]
};
const DEMO={total:20,emotion:{"容易生氣、煩躁":9,"焦慮、緊張":7,"難過、低落":4,"課業升學壓力大":12,"不說出自己的感受":10,"沒有明顯困擾":2},behavior:{"衝動、頂嘴":6,"拖延、要一直催":13,"過度使用手機網路":15,"不遵守規範":7,"遇到困難就逃避":8,"沒有明顯困擾":1},social:{"與孩子溝通時，經常演變成責備、爭吵或冷戰":11,"與同學容易發生爭執或意見衝突":5,"覺得自己沒有知心朋友，或常感到被孤立":4,"曾遭遇言語嘲諷、排擠、欺負或網路霸凌":3,"不容易表達自己的想法，也不敢拒絕他人的要求":9,"家長與教師對孩子的管教方式或期待不同":6,"近期沒有明顯的人際互動困擾":3},priority:{"情緒":7,"行為":9,"人際":4}};

// 統計頁旁邊的 index.html 就是家長掃的問卷
const surveyUrl=new URL("./index.html",location.href).href.replace(/index\.html$/,"");
new QRCode(document.getElementById("qr"),{text:surveyUrl,width:132,height:132,correctLevel:QRCode.CorrectLevel.M});

function bars(id,key,d){
  const p=document.getElementById(id);p.querySelectorAll(".row").forEach(r=>r.remove());
  const total=d.total||0,vals=d[key]||{};
  const max=Math.max(1,...Object.values(vals));
  ORDER[key].forEach(label=>{
    const n=vals[label]||0;
    const row=document.createElement("div");row.className="row";
    row.innerHTML='<div class="lab"></div><div class="track"><div class="fill"></div></div><div class="num"></div>';
    row.querySelector(".lab").textContent=label;
    const f=row.querySelector(".fill");f.style.background="var(--c)";f.style.width=(n/max*100)+"%";
    row.querySelector(".num").textContent=total?Math.round(n/total*100)+"%":"0%";
    row.title=n+" 人";
    p.append(row);
  });
}
function render(d,demo){
  document.getElementById("total").textContent=d.total;
  bars("p-emotion","emotion",d);bars("p-behavior","behavior",d);bars("p-social","social",d);
  const pri=document.getElementById("pri");pri.innerHTML="";
  ["情緒","行為","人際"].forEach(k=>{
    const c=document.createElement("div");c.className="chip";
    const n=(d.priority||{})[k]||0;
    c.innerHTML='<b></b><span></span>';c.querySelector("b").textContent=n;c.querySelector("span").textContent=k;pri.append(c);
  });
  document.getElementById("note").textContent=demo?"目前顯示示範資料：貼上 API_URL 後會改成真實回覆。百分比＝勾選該項的家長 ÷ 全部回覆。":"每 5 秒自動更新。百分比＝勾選該項的家長 ÷ 全部回覆，可複選。";
}
async function load(){
  if(!API_URL){render(DEMO,true);return}
  try{const r=await fetch(API_URL,{cache:"no-store"});render(await r.json(),false)}catch(e){document.getElementById("note").textContent="暫時讀不到資料，稍後自動重試。"}
}
load();if(API_URL)setInterval(load,5000);
</script>
</body>
</html>
